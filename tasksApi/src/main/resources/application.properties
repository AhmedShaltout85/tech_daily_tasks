# Server Configuration
server.port=9999
server.servlet.context-path=/tasks-api

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tech_daily_tasks;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=awco
spring.datasource.password=awco
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration for Unicode Support
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.use_unicode=true
spring.jpa.properties.hibernate.characterEncoding=utf8

# JWT Configuration (512-bit key required for HS512)
jwt.secret=mySecretKey123456789012345678901234567890123456789012345678901234567890
jwt.expiration.ms=86400000

# Logging
logging.level.com.ao8r.tasks_api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
