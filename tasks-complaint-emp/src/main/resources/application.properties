# Server Configuration
spring.application.name=tasks-complaint-emp


# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=tech_daily_tasks;encrypt=false;trustServerCertificate=true
#spring.datasource.url=jdbc:sqlserver://172.18.0.101:1433;databaseName=tech_daily_tasks;encrypt=false;trustServerCertificate=true
spring.datasource.username=awco
spring.datasource.password=awco
server.servlet.context-path=/tasks-complaint-emp
server.port=9999
spring.datasource.hikari.connection-timeout=60000
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
spring.jpa.properties.hibernate.jdbc.time_zone=GMT+2
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


# Logging
logging.level.com.ao8r.tasks_api=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Timezone
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC


